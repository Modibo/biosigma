name: biosigma
description: "BioSigma — calculs de biochimie clinique et d'hémostase, hors connexion"
publish_to: 'none'

version: 1.19.0+24

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  url_launcher: ^6.3.0

  biosigma_core:
    path: ../../packages/biosigma_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "docs_assets/icon_1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1A33"
  adaptive_icon_foreground: "docs_assets/icon_foreground_1024.png"

flutter_native_splash:
  color: "#0F2245"
  image: "docs_assets/icon_foreground_1024.png"
  android_12:
    image: "docs_assets/icon_foreground_1024.png"
    color: "#0F2245"
  web: false

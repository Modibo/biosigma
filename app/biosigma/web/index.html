<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
        content="BioSigma — calculs de biochimie clinique et d'hémostase pour biologistes médicaux, hors connexion.">
  <meta name="theme-color" content="#0F2245">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BioSigma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BioSigma — biochimie clinique et hémostase</title>
  <link rel="manifest" href="manifest.json">

  <!-- Logo affiché immédiatement (avant même le chargement de Flutter),
       retiré au premier rendu — équivalent web de l'écran de démarrage
       natif Android/iOS (flutter_native_splash). -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      background: #0F2245;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      z-index: 9999;
    }
    #app-splash .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #8FF0FF;
      border-radius: 50%;
      animation: app-splash-spin 0.9s linear infinite;
    }
    #app-splash p {
      margin: 0;
      padding: 0 24px;
      max-width: 320px;
      text-align: center;
      font: 14px/1.4 system-ui, sans-serif;
      color: rgba(255, 255, 255, 0.75);
    }
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    #app-splash img {
      width: 25vw;
      max-width: 140px;
      min-width: 72px;
      border-radius: 22%;
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <img src="icons/Icon-192.png" alt="BioSigma">
    <div class="spinner" role="progressbar" aria-label="Chargement"></div>
    <p>Chargement de BioSigma… Le premier démarrage télécharge quelques Mo et peut prendre une minute sur une connexion lente ; les suivants sont rapides.</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-splash');
      if (splash) splash.remove();
      // Premier lancement : demande au service worker de conserver aussi les
      // fichiers du moteur graphique déjà chargés (voir biosigma_sw.js).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function (reg) {
          var urls = performance.getEntriesByType('resource')
            .map(function (e) { return e.name; })
            .filter(function (u) { return u.indexOf('/canvaskit/') !== -1; });
          if (reg.active && urls.length) reg.active.postMessage({ type: 'cacheUrls', urls: urls });
        });
      }
    });

    // Service worker BioSigma (biosigma_sw.js) : mise en cache complète de
    // l'application pour un démarrage instantané et l'usage hors connexion.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('biosigma_sw.js')
          .catch(function (e) { console.warn('Service worker non enregistré :', e); });
      });
    }

    // Appelé par le bandeau « Recharger » : demande au navigateur de
    // récupérer le nouveau service worker, le fait basculer dès qu'il est
    // installé, puis recharge la page. Retombe sur un simple rechargement si
    // aucun service worker n'est actif.
    window.biosigmaApplyUpdate = async function () {
      try {
        var reg = await navigator.serviceWorker.getRegistration();
        if (!reg) { location.reload(); return; }
        await reg.update();
        var worker = reg.installing || reg.waiting;
        if (worker) {
          await new Promise(function (resolve) {
            if (worker.state === 'installed') return resolve();
            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' || worker.state === 'redundant') resolve();
            });
          });
          if (reg.waiting) {
            navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
            reg.waiting.postMessage('skipWaiting');
            return;
          }
        }
      } catch (e) { console.warn(e); }
      location.reload();
    };
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

# BioSigma — service nginx statique (build Flutter Web).
# Caddy (façade HTTPS) reverse-proxy vers ce conteneur ; nginx n'est jamais
# exposé directement sur l'internet (voir docker-compose.yml : loopback only).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (Caddy compresse aussi en façade ; ceci reste utile pour
    # les accès directs via tunnel SSH pendant la vérification).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml font/woff2;

    # index.html, le service worker et version.json ne doivent JAMAIS être
    # mis en cache : c'est par eux que le navigateur détecte une nouvelle
    # version de l'application (même piège que le service worker de
    # PhénoBac — un cache figé retarde la mise à jour côté client).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }
    # main.dart.js (le code compilé de l'app) et les scripts de démarrage ne
    # sont pas versionnés dans leur nom de fichier : sans ce no-cache, un
    # navigateur peut continuer à exécuter l'ancienne version compilée après
    # une mise à jour, même une fois index.html rafraîchi.
    location ~* ^/(main\.dart\.js|flutter\.js|flutter_bootstrap\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Polices, images et CanvasKit changent rarement entre deux versions :
    # cache longue durée.
    location ~* ^/(assets|canvaskit)/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Toute route inconnue retombe sur index.html (SPA Flutter).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
